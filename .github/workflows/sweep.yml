name: Sweep mantid PRs
# every run is a dispatch, so name each by what it does
run-name: ${{ inputs.RESET && 'Reset' || inputs.DRY_RUN && 'Dry run' || 'Sweep' }}

# Started every 5 minutes in UK working hours by cron-job.org (see README.md), not by `schedule`: GitHub never
# fired this repo's schedule at all. With no schedule, GitHub's 60-day auto-disable doesn't apply either.
on:
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: 'Read GitHub and Slack and log what would change, without writing to Slack'
        type: boolean
        default: true
      RESET:
        description: 'Delete every post and thread the bot has made, instead of sweeping (the next sweep reposts what still qualifies)'
        type: boolean
        default: false

# sweeps must not overlap, or two of them can post the same PR
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sweep open pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.DRY_RUN && '--dry-run' || '' }}
          RESET: ${{ inputs.RESET && '--reset' || '' }}
        run: python3 pr_review_tracker.py $DRY_RUN $RESET
